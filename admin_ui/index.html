<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>丸子bot · 控制台</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="login-view" class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">MARUKO BOT</p>
        <h1 id="login-title">本机控制台</h1>
        <p>输入 <code>BOT_ADMIN_TOKEN</code> 以连接正在运行的机器人。</p>
        <form id="login-form">
          <label>
            管理令牌
            <input id="token-input" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">进入控制台</button>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </section>

      <section id="console-view" class="console hidden">
        <aside class="sidebar">
          <div>
            <p class="eyebrow">MARUKO BOT</p>
            <h1>控制台</h1>
            <p class="connection"><span></span> 已连接 · <strong id="operation-count">0</strong> 项操作</p>
          </div>
          <div class="sidebar-actions">
            <button id="refresh-button" class="quiet">刷新操作</button>
            <button id="logout-button" class="quiet">退出</button>
          </div>
        </aside>

        <section class="workspace">
          <header class="workspace-header">
            <div>
              <p class="eyebrow">QQ BOT API</p>
              <h2>操作面板</h2>
            </div>
            <label class="search">
              <span>搜索</span>
              <input id="search-input" type="search" placeholder="例如：发送消息、日程、频道" />
            </label>
          </header>

          <p class="notice">此页面只提供已登记的非删除操作。禁言时长按秒填写，填 0 可解除禁言。请求仅发送到本机运行的 Bot。</p>
          <div id="operation-list" class="operation-list" aria-live="polite"></div>
        </section>

        <aside class="result-panel" aria-live="polite">
          <div class="result-heading">
            <div>
              <p class="eyebrow">RESPONSE</p>
              <h2>调用结果</h2>
            </div>
            <button id="clear-result" class="quiet">清空</button>
          </div>
          <p id="result-status" class="result-status">选择并执行一个操作后，结果会显示在这里。</p>
          <pre id="result-output">{}</pre>
        </aside>
      </section>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
